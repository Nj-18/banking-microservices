server:
  port: 8082

spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:mysql://localhost:3306/customer_db
    username: root
    password: Smartnj18@
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true

  config:
    import: "optional:configserver:http://localhost:8888"

jwt:
  secret: ThisIsMySuperSecretKeyForBankingApplication12345678901234567890
  expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

